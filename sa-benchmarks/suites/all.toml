# The master run: every suite in one session, into one report.
#
# Not a suite — it has no arms or axes of its own. `run.sh all` reads this to decide what to run, in
# what order, and what to do when this machine cannot run part of it.

description = "Everything: one session, one report characterising this commit"

# Cheapest and root-free first, so a session that is going to fail on privileges has already
# produced the throughput numbers by the time it gets there. `defaults` leads because it is the
# regression gate: if it moved, the rest is context for why — and `kmer` and `mlp` follow it
# immediately, because they are the two accelerators `defaults` holds fixed, so "what changed"
# and "which of the two settings it changed for" land next to each other in the report.
#
# The four knob suites run together, after the gate: `kmer` and `mlp` are the two accelerators
# `defaults` holds fixed, and `validate` and `prefetch` are the remaining SearchTuning fields. One
# session, one report — a knob's answer is read against what the same box did on the same commit at
# the shipped settings, and splitting them across sessions means comparing two machines' moods.
order = [
  "defaults",                                   # the gate: what ships, across the four search options
  "kmer", "mlp", "validate", "prefetch",        # one knob each, against a fixed background
  "mlp_validate", "combos",                     # crossed: are those knobs separable?
  "stream",                                     # what the CALLER sets: how many peptides in one
                                                # call. Held fixed everywhere above.
  "startup", "ram", "threads",
]

# Suites that need root. When it is unavailable they are SKIPPED and the report says so in their
# section — never omitted, which would read as "nothing to report here".
optional = ["ram", "threads"]
