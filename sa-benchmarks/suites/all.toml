# The master run: every suite in one session, into one report.
#
# Not a suite — it has no arms or axes of its own. `run.sh all` reads this to decide what to run, in
# what order, and what to do when this machine cannot run part of it.

description = "Everything: one session, one report characterising this commit"

# Cheapest and root-free first, so a session that is going to fail on privileges has already
# produced the throughput numbers by the time it gets there. `defaults` leads because it is the
# regression gate: if it moved, the rest is context for why — and `kmer` follows it immediately,
# because it is the one accelerator `defaults` holds fixed, so "what changed" and "which setting it
# changed for" land next to each other in the report.
#
# There were five more suites here — `mlp`, `validate`, `prefetch`, `mlp_validate` and `combos` —
# one per runtime performance knob, plus their crosses. They went with `SearchTuning` itself: the
# 660befd7ee run could not separate any value of `validate_batch`, `prefetch_threshold` or
# `retrieval_prefetch_distance` from noise (0 of 40 and 0 of 80 cells), and `mlp_batch` had no
# value that won everywhere, so all four became compile-time constants. Nothing the searcher reads
# is settable at runtime any more, so no suite can sweep one.
#
# What is left all measures something that is still a choice: the workload (`defaults`, `stream`),
# the index build (`kmer`), or the machine (`startup`, `ram`, `threads`).
order = [
  "defaults",                                   # the gate: what ships, across the four search options
  "kmer",                                       # the one build-time accelerator
  "stream",                                     # what the CALLER sets: how many peptides in one
                                                # call. Held fixed everywhere above.
  "startup", "ram", "threads",
]

# Suites that need root. When it is unavailable they are SKIPPED and the report says so in their
# section — never omitted, which would read as "nothing to report here".
#
# Every suite declaring `needs_root` belongs here. A suite that needs it and is left out is a hard
# FAIL instead of a skip (`preflight._plan_suite`), which stops the whole session on a machine that
# was only ever going to run the other suites — `startup` was in that position.
optional = ["startup", "ram", "threads"]
