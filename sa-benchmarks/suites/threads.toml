description = "Whether thread oversubscription pays, by how much, and what it costs when RAM is ample"

mode = "single"
# Arms adjacent within each (ceiling, threads) point, with no replication: the arm gap is the
# smaller and more delicate effect, so it is measured over the smallest possible time window. The
# evidence that it is real is agreement across the thread counts, each an independent estimate of
# the same gap — not an ABBA pair.
ordering = "sequential"
needs_root = true
drop_caches = true

notes = """
A major fault blocks its thread, and a CPU prefetch hint cannot fault, so once pages stop being
resident the index's memory-level-parallelism machinery is inert and every miss idles a core.
Oversubscription overlaps those stalls instead of removing them.

Established by the sweeps this suite replaces: oversubscription costs about 10% unconstrained and
gains +65.3% at a 167G ceiling and +94.4% at 112G — a deployment knob, not a default, whose value
scales with the fault rate. At 167G the curve is monotonic downward from 96 (96 > 128 > 192), so the
peak is at or below 96. Major faults stayed flat across thread counts (0.24% spread).

Read it this way:

  * `majflt` should stay FLAT across thread counts at a given ceiling. Threads change how many
    faults are in flight, not how many there are. If it moves, something else changed too.
  * `unconstrained` is the go/no-go for making a thread count the default: with no faults to hide,
    oversubscription is pure context-switch overhead. If it costs there, it stays a deployment knob.
  * If the optimum at the tighter ceiling is higher than at the looser one, the rule is "scale
    threads with the fault rate", not a fixed number.
  * `pprot vs mmap` should hold the same sign across every thread count at a ceiling. Oversubscription
    hides faults; it does not remove them, so if the arms' fault COUNTS still differ while their
    throughput gap closes, the win is being overlapped rather than eliminated — and it will reopen on
    slower storage.

The grid is deliberately modest, since the peak is already bracketed at <= 96. Widen `threads` to
bracket it more finely, or add ceilings, at the cost of roughly an hour per cell on the full database.
"""

[defaults]
runs = 40
amount = 10000
peptides = "mixed"
kmer_table = "k6"
warmup = "all:1000000"
no_theoretical_memory = true

[axes]
ceiling_gb = [0, 167, 112]
# "default" leaves RAYON_NUM_THREADS unset, i.e. one thread per core.
threads = ["default", 48, 96]

[[arms]]
name = "mmap"
features = ["mmap"]

[[arms]]
name = "pprot"
features = ["mmap", "preloaded-proteins"]
