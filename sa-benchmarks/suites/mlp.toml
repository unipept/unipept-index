description = "The cross-query MLP batch curve, per peptide length regime and per backend"

mode = "matrix"
# Palindrome, not sequential: every arm runs the whole grid twice, forward then reversed. A matrix
# invocation emits EVERY cell of an arm, so its reps are one sample repeated rather than n samples —
# whatever shifts the process shifts all of its cells together, and a per-cell band cannot see it.
# The gap between an arm's two invocations is the only estimate of that the mode can produce, and
# `floor_of` treats it as a floor. It costs this suite twice its wall clock, and it is what stopped
# a per-invocation offset being read as an arm difference (`pprot` vs `preloaded` flipped sign
# between suites while each suite was internally one-sided — the signature of exactly that).
#
# Note the asymmetry the ordering has: with three arms the slots run a b c c b a, so the FIRST arm's
# two invocations straddle the suite while the last arm's are adjacent. The first arm therefore
# carries the widest spread, and since `floor_of` takes the widest across both cells of a
# comparison, that is the one that governs. Declare the arm whose stability is most in question
# first.
ordering = "palindrome"

notes = """
One question: how many independent peptide searches should be interleaved per rayon task. That is
`mlp_batch`, the CROSS-QUERY batch — B=1 is the scalar path, and `DEFAULT_MLP_BATCH` is what
`search_all_peptides` passes on every server request. It is not the same knob as
`SearchTuning::validate_batch`, which batches candidate suffixes WITHIN one range scan; that one
belongs to `validate`; the two crossed are `mlp_validate`.

The k-mer table is held at the shipped 6-mer. Crossing the batch with the tables is a different
question — whether the three accelerators are separable — and `combos` asks it.

The mechanism: a suffix-array probe is a random read whose address depends on the previous probe's
result, so a single search is a dependent chain of cache misses with nothing to overlap. Batching B
searches per task gives the memory system B independent chains at once, and the win is however much
of that latency the hardware can then hide.

Which means the curve's shape is a property of WHAT IS LIMITING the machine, and that is the thing
to read here:

  * a curve that rises and plateaus says memory-level parallelism was the constraint and batching
    found it.
  * a curve that is flat says something else is the wall. On the full database that has been the
    measured answer — +4% peaking at B=16 against +57% on swissprot — because a 242 GB working set
    misses the TLB on every access and there are only ~2-4 hardware page walkers per core, so the
    per-core parallelism is capped there no matter how many data prefetches are in flight.
  * a curve that rises and then FALLS puts the top of the useful range at the peak; past it the
    per-step bookkeeping costs more than the overlap saves.

Expect the answer to differ by peptide length and to differ between swissprot and the full database.
It is measured per bucket for that reason, and the value that ships has to win the mixed reality,
not the friendliest bucket.

This is the only measurement of the curve. A second, instrumented one used to live in a `detail`
suite; its counters perturbed throughput by ~2% and it swept one peptide file, so it was a worse
copy of this. What only the counters can produce — the binary-search/range-scan split behind the
curve — is now one instrumented arm inside `defaults`.

`equate_il` is HELD at the shipped value here; only `tryptic` is swept. The two are not equivalent
contexts, and the instrumented arm in `defaults` is what settles it — with I/L equated or not, the
search examines about the same candidates (1.26M against 1.15M) and accepts about the same share of
them (10.7% against 11.0%), and the binary-search/range-scan split barely moves (46/54 against
42/58). Under tryptic all three change at once: 9x fewer candidates, acceptance down to ~2%, and the
split inverts to 86/14. So tryptic is a different workload and earns its multiplication; equate_il
is the same workload with a different answer, which is a question for `defaults` and nowhere else.
Crossing it here cost 45% of the whole sweep and moved a resolved k-mer winner in 2 of 23 contexts.
"""

[defaults]
runs = 100
# Stop a cell early once its band is as tight as the floor can use. `floor_of` is
# max(band, slot spread, drift residual, NOISE_FLOOR_PCT) and NOISE_FLOOR_PCT is 3.9, so once a
# cell's band reaches 3.9% the floor is pinned there and further reps cannot narrow anything —
# they are provably wasted. Cells noisier than that never converge and run the full `runs`, which
# is the half of the sweep where the reps are doing something.
#
# `min_runs` is the guard, and 40 is not arbitrary. `band` is a percentile spread of the reps
# ((p90-p10)/2/p50), not a standard error: adding reps makes it converge UPWARD to the true spread
# rather than shrinking it, and small samples read narrow. Simulated against a distribution whose
# true band is 8.3%, twenty reps average 7.5% and forty average 7.9%. Below forty the risk is not
# a slow run, it is a cell that stops on a lucky-narrow band and reports a floor tighter than it
# earned: for a cell whose true band is 5.1% — just above the target, the only place it can happen —
# that risk is 34% at min_runs=20, 11% at 40 and 4% at 60. Forty buys most of the protection while
# still stopping the quiet cells.
#
# Deliberately NOT set in `defaults` (the gate wants a fixed rep count so two sessions are
# comparable), nor in `ram`/`threads` (single mode, and the runner only forwards this for matrix
# suites), nor in `stream` (its short-call cells are the noisy ones by construction and would run
# the full count anyway).
runs_target_band = 3.9
min_runs = 40
# Page sweep, then 200k real queries. The sweep only warms what is MAPPED, so on an arm that
# preloads a structure the one thing that arm exists to buy goes into the first timed cell cold.
# `ram`/`threads` warm the pipeline and put `pprot` +14-16% over `mmap` on the mixed file; the matrix
# suites did not and put the same pair at +0.3-9.6%. With `ptext` and `pmap` here — which preload
# more than any other arm — measuring them behind a page sweep alone would understate exactly the
# arms the suite was extended to compare.
warmup = "all:200000"
amount = 10000
max_matches = 10000
# `mixed` is the unbucketed 5..50 file — the query mix a server actually sees, and the one
# number to quote. The three buckets are there to say WHERE a change landed, since peptide length
# moves throughput by two orders of magnitude and a mixed-only result hides which regime moved.
files = ["mixed", "small", "medium", "large"]

[[sweep]]
name = "mlp"
# `ofat` over a single knob is the curve: the shipped value plus every other value of it, with every
# other SearchTuning field held at its default.
strategy = "ofat"
arms = ["preloaded", "mmap", "pprot", "ptext", "pmap"]
kmer = [6]
equate_il = [true]
tryptic = [true, false]
# The reference cell is re-measured every 12 cells, so drift across the process becomes a measured
# series and each cell is rescaled against it. A process this size takes long enough that the
# machine moves under it by more than the effects being reported — see the resolution table.
base_every = 12

[sweep.tune]
mlp_batch = [1, 4, 8, 16, 32, 64, 128]

[[arms]]
name = "preloaded"
features = []

[[arms]]
name = "mmap"
features = ["mmap"]

# `pprot` plus the protein text. This is the arm that closed the gap: at 402fbcb546 it tied fully
# preloaded in 16 of 16 cells while `pprot` closed only 18%, because the text is read once per
# residue compared and is the whole of the search cost, where the metadata is the whole of the
# retrieval cost. Carried by every suite so that no knob is tuned only against configurations that
# are no longer the fastest ones.

[[arms]]
# The middle ground, and the one that turned out to matter: everything mapped except the protein
# store, which is the structure retrieval walks. Kept alongside the two extremes everywhere, because
# a result that holds for both of them can still fail for the configuration actually deployed.
name = "pprot"
features = ["mmap", "preloaded-proteins"]

[[arms]]
name = "ptext"
features = ["mmap", "preloaded-text", "preloaded-proteins"]

# Everything preloaded EXCEPT the suffix array — the last step before the fully preloaded build,
# and the one that isolates what the SA costs when mapped. `defaults` at 402fbcb546 found `ptext`
# already tied with fully preloaded, so whatever the SA and the mapping are worth is inside the
# floor there; this arm splits that remainder, since it differs from `ptext` in the mapping alone.
# The mapping is read once per matched suffix in retrieval pass 1, where `ptext` and `pprot` both
# sit 1.10x behind fully preloaded — the 18% of the retrieval gap neither of them closes.

[[arms]]
name = "pmap"
features = ["mmap", "preloaded-text", "preloaded-proteins", "preloaded-mapping"]
