description = "The production-default grid across small/medium/large, both backends — the regression gate"

# Matrix mode: ONE process per backend loads the index once and sweeps the whole grid in-process.
# Index loads dominate everything else at full-database scale (37e9 suffixes), so a process per
# configuration would spend the entire run loading. Two index loads total, not one per cell.
mode = "matrix"
ordering = "sequential"

notes = """
This is the sweep to run after any change to the search path. It measures what ships: production
defaults, both storage backends, across the three peptide length regimes.

Read the `noise` column before the `mmap/pre` column. The measured run-to-run noise floor on the
full database is 3.9%, and any delta below that — or below a cell's own measured band — is noise,
not signal.

The grid is kmer {none, 5-mer} x equate_il x tryptic x mlp_batch {1, 16}, with tryptic collapsed to
one representative cell on the small and medium files: in the last full run all 30 small/tryptic
cells landed at 653-684 qps, a flat line rather than a grid, and sweeping it there re-measures a
constant at about a sixth of the whole matrix's wall time. `large` keeps the full sweep, where
tryptic is bound by search and retrieval volume rather than being constant.

There are two different batches in the searcher, and BOTH are production values:

  * `mlp_batch` — the CROSS-QUERY batch: how many independent peptide searches are interleaved per
    rayon task to hide DRAM latency. 1 is scalar; 16 is `DEFAULT_MLP_BATCH`, what `search_all_peptides`
    passes on every server request.
  * `SearchTuning::validate_batch` — candidates per two-pass validation batch inside
    `iterate_sa_range`, default 64. `sa-server` never assigns `tuning`, so this is what ships too.

The difference is not production-vs-not, it is swept-vs-held. This grid varies `mlp_batch` because
it is a coarse structural choice with a large effect, and holds every `SearchTuning` field at its
default because prior measurement already settled them — `validate_batch` in particular is a cliff
rather than a peak (16 costs ~10%, 128 gains nothing), so sweeping it would re-measure a decision.

Held values are not assumed: the run records every `SearchTuning` field, and the summary prints back
what these cells actually ran at. If that line does not read 64 / 32 / 32, this run
was not measuring the defaults. To put those knobs under test, set MATRIX_TUNING_* and compare
against a run at the defaults.

The 6-mer table is off by default. With the index resident it is inside the noise floor on
medium/small and only +4.1% on large, for 3.06 GB resident against 127 MB. That verdict does NOT
hold under a memory ceiling — see the `ram` suite.
"""

[defaults]
# 20 reps matches the measured 3.9% noise floor; do not lower it without re-checking that floor.
runs = 20
amount = 10000
max_matches = 10000

[matrix]
files = ["small", "medium", "large"]
batches = [1, 16]
kmer6 = false

[[arms]]
name = "preloaded"
features = []

[[arms]]
name = "mmap"
features = ["mmap"]
