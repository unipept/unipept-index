description = "Both prefetch distances, crossed — and whether either is worth keeping as a knob"

mode = "matrix"
ordering = "sequential"

notes = """
Two knobs, one mechanism at two points in the search:

  * `prefetch_threshold`          — how large a candidate range has to be before the two-pass
                                    validation path is used at all, rather than a straight scan.
  * `retrieval_prefetch_distance` — how far ahead the retrieval loop issues its hints while walking
                                    the matched suffixes.

Both are software prefetch distances, so both are bets on how far ahead the hardware needs to be
told about a load. A distance too short does not cover the latency; too long and the line is
evicted before it is used, or the extra hints displace something useful. The interesting shape is
therefore a plateau with soft edges, and the useful answer is usually "anywhere in the middle".

Swept as a full 4x4 cross rather than two curves, which is honest at sixteen points and lets the
report say whether the two distances interact — they are consuming the same hardware, so a plane
costs almost nothing extra and is the only way to find out.

**This suite is expected to conclude that neither knob pays.** Both read flat in every context
measured so far, and `docs/design/README.md` records that scalar k-mer prefetch was already killed
for the same reason: median +0.3%, inside the noise floor, removed rather than left as a knob. The
last full-database run put that beyond doubt: 0 of 48 pairs cleared their own floor, on any backend.
Read the resolution table first — a process whose residual is wider than the effects below it has
not shown flatness, it has shown nothing.

What that flatness does NOT license is reading the argmax as an answer. The best pair differs by
backend and every one of them sits inside its own floor, so the shipped 32/32 stays until something
beats it past the floor rather than merely topping a column. Both fields are also being kept despite
the null result; `docs/design/README.md` carries the evidence and that decision separately, which is
the distinction to preserve when reading this section.

`equate_il` is HELD at the shipped value here; only `tryptic` is swept. The two are not equivalent
contexts, and the instrumented arm in `defaults` is what settles it — with I/L equated or not, the
search examines about the same candidates (1.26M against 1.15M) and accepts about the same share of
them (10.7% against 11.0%), and the binary-search/range-scan split barely moves (46/54 against
42/58). Under tryptic all three change at once: 9x fewer candidates, acceptance down to ~2%, and the
split inverts to 86/14. So tryptic is a different workload and earns its multiplication; equate_il
is the same workload with a different answer, which is a question for `defaults` and nowhere else.
Crossing it here cost 45% of the whole sweep and moved a resolved k-mer winner in 2 of 23 contexts.
"""

[defaults]
runs = 100
# Page sweep, then 200k real queries. The sweep only warms what is MAPPED, so on an arm that
# preloads a structure the one thing that arm exists to buy goes into the first timed cell cold.
# `ram`/`threads` warm the pipeline and put `pprot` +14-16% over `mmap` on the mixed file; the matrix
# suites did not and put the same pair at +0.3-9.6%. With `ptext` and `pmap` here — which preload
# more than any other arm — measuring them behind a page sweep alone would understate exactly the
# arms the suite was extended to compare.
warmup = "all:200000"
amount = 10000
max_matches = 10000
# `mixed` only. Both knobs are about covering memory latency, which is a property of the access
# pattern rather than of peptide length, and a flat result does not become more informative for
# being confirmed in four regimes. Widen this if the plane turns out NOT to be flat.
files = ["mixed"]

[[sweep]]
name = "plane"
strategy = "full"
arms = ["preloaded", "mmap", "pprot", "ptext", "pmap"]
kmer = [6]
equate_il = [true]
tryptic = [true, false]
base_every = 8

# Brackets the shipped 32/32 on both sides, which is what makes a flat reading mean something: an
# edge value could only ever be shown to be no worse than its neighbours, never to be a peak. Widen
# this if the shipped pair moves outward.
[sweep.tune]
prefetch_threshold          = [8, 16, 32, 64]
retrieval_prefetch_distance = [8, 16, 32, 64]

[[arms]]
name = "preloaded"
features = []

[[arms]]
name = "mmap"
features = ["mmap"]

# `pprot` plus the protein text. This is the arm that closed the gap: at 402fbcb546 it tied fully
# preloaded in 16 of 16 cells while `pprot` closed only 18%, because the text is read once per
# residue compared and is the whole of the search cost, where the metadata is the whole of the
# retrieval cost. Carried by every suite so that no knob is tuned only against configurations that
# are no longer the fastest ones.

[[arms]]
# The middle ground, and the one that turned out to matter: everything mapped except the protein
# store, which is the structure retrieval walks. Kept alongside the two extremes everywhere, because
# a result that holds for both of them can still fail for the configuration actually deployed.
name = "pprot"
features = ["mmap", "preloaded-proteins"]

[[arms]]
name = "ptext"
features = ["mmap", "preloaded-text", "preloaded-proteins"]

# Everything preloaded EXCEPT the suffix array — the last step before the fully preloaded build,
# and the one that isolates what the SA costs when mapped. `defaults` at 402fbcb546 found `ptext`
# already tied with fully preloaded, so whatever the SA and the mapping are worth is inside the
# floor there; this arm splits that remainder, since it differs from `ptext` in the mapping alone.
# The mapping is read once per matched suffix in retrieval pass 1, where `ptext` and `pprot` both
# sit 1.10x behind fully preloaded — the 18% of the retrieval gap neither of them closes.

[[arms]]
name = "pmap"
features = ["mmap", "preloaded-text", "preloaded-proteins", "preloaded-mapping"]
