description = "How throughput depends on how many peptides are in one call"

mode = "matrix"
# Palindrome, not sequential: every arm runs the whole grid twice, forward then reversed. A matrix
# invocation emits EVERY cell of an arm, so its reps are one sample repeated rather than n samples —
# whatever shifts the process shifts all of its cells together, and a per-cell band cannot see it.
# The gap between an arm's two invocations is the only estimate of that the mode can produce, and
# `floor_of` treats it as a floor. It costs this suite twice its wall clock, and it is what stopped
# a per-invocation offset being read as an arm difference (`pprot` vs `preloaded` flipped sign
# between suites while each suite was internally one-sided — the signature of exactly that).
#
# Note the asymmetry the ordering has: the slots run forward then reversed (a b c … c b a), so the
# FIRST arm's two invocations straddle the suite while the last arm's are adjacent. The first arm
# therefore carries the widest spread, and since `floor_of` takes the widest across both cells of a
# comparison, that is the one that governs. Declare the arm whose stability is most in question
# first.
ordering = "palindrome"

notes = """
The one suite that varies the query count, because everywhere else it has to be fixed: two cells
that ran different stream lengths are not comparable, so a suite holding everything else constant
must hold this constant too. Here it IS the variable.

The mechanism is occupancy. `search_all_matching_suffixes` splits its input with
`par_chunks(MLP_BATCH)`, so a call of N peptides produces `N / 16` rayon tasks. At the
10,000 every other suite measures, that is 625 tasks and the machine is saturated. At a realistic
50-peptide request it is three, and on a twelve-core box nine cores idle for the whole call.
Retrieval has the same shape: it parallelises over the peptides that matched.

So every throughput figure in this report is an upper bound taken at the one call size that
guarantees full occupancy, and this suite is what says how far below it a real request lands. The
number to take away is the KNEE — the smallest call size that reaches within the floor of the
saturated figure. That is a number for client documentation, and it is not 10,000.

Per-rep wall time varies enormously down this sweep: the small cells run few queries and finish in
milliseconds, so their bands are wide. Read the resolution table and the per-cell band before any
delta near the bottom of the range.

`equate_il` is HELD at the shipped value here; only `tryptic` is swept. The two are not equivalent
contexts, and the instrumented arm in `defaults` is what settles it — with I/L equated or not, the
search examines about the same candidates (1.26M against 1.15M) and accepts about the same share of
them (10.7% against 11.0%), and the binary-search/range-scan split barely moves (46/54 against
42/58). Under tryptic all three change at once: 9x fewer candidates, acceptance down to ~2%, and the
split inverts to 86/14. So tryptic is a different workload and earns its multiplication; equate_il
is the same workload with a different answer, which is a question for `defaults` and nowhere else.
Crossing it here cost 45% of the whole sweep and moved a resolved k-mer winner in 2 of 23 contexts.
"""

[defaults]
runs = 100
# Page sweep, then 200k real queries. The sweep only warms what is MAPPED, so on an arm that
# preloads a structure the one thing that arm exists to buy goes into the first timed cell cold.
# `ram`/`threads` warm the pipeline and put `pprot` +14-16% over `mmap` on the mixed file; the matrix
# suites did not and put the same pair at +0.3-9.6%. With `ptext` and `pmap` here — which preload
# more than any other arm — measuring them behind a page sweep alone would understate exactly the
# arms the suite was extended to compare.
warmup = "all:200000"
max_matches = 10000
files = ["mixed", "small", "medium", "large"]
# The fallback for blocks that do not sweep it; `amounts` below is what actually varies.
amount = 10000

[[sweep]]
name = "stream"
arms = ["preloaded", "mmap", "pprot", "ptext", "pmap"]
kmer = [5]
equate_il = [true]
tryptic = [true, false]
amounts = [10, 100, 1000, 10000]
base_every = 12

[[arms]]
name = "preloaded"
features = []

[[arms]]
name = "mmap"
features = ["mmap"]

# `pprot` plus the protein text. This is the arm that closed the gap: at 402fbcb546 it tied fully
# preloaded in 16 of 16 cells while `pprot` closed only 18%, because the text is read once per
# residue compared and is the whole of the search cost, where the metadata is the whole of the
# retrieval cost. Carried by every suite so that no knob is tuned only against configurations that
# are no longer the fastest ones.

[[arms]]
name = "pprot"
features = ["mmap", "preloaded-proteins"]

[[arms]]
name = "ptext"
features = ["mmap", "preloaded-text", "preloaded-proteins"]

# Everything preloaded EXCEPT the suffix array — the last step before the fully preloaded build,
# and the one that isolates what the SA costs when mapped. `defaults` at 402fbcb546 found `ptext`
# already tied with fully preloaded, so whatever the SA and the mapping are worth is inside the
# floor there; this arm splits that remainder, since it differs from `ptext` in the mapping alone.
# The mapping is read once per matched suffix in retrieval pass 1, where `ptext` and `pprot` both
# sit 1.10x behind fully preloaded — the 18% of the retrieval gap neither of them closes.

[[arms]]
name = "pmap"
features = ["mmap", "preloaded-text", "preloaded-proteins", "preloaded-mapping"]
