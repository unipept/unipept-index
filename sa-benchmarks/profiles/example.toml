# Machine profile template. Copy to `local.toml` (gitignored) and edit for this machine.
#
#   cp sa-benchmarks/profiles/example.toml sa-benchmarks/profiles/local.toml
#
# Suites refer to peptide files and k-mer tables by NAME, never by path, so the same suite runs
# anywhere a profile exists. Every path below is checked at startup: a sweep that discovers a
# missing peptide bucket four hours in has wasted four hours.

# The index directory: sa.bin, proteins.bin, mapping.bin and warmup.txt. The dated release name
# differs per machine — check what this box actually has rather than copying it from a script.
index_dir = "uniprot-2026-01/suffix-array"

# Where binaries and results go. Never inside the repo: results are machine-specific and large.
# Relative paths resolve against the repo root; a benchmark server usually wants a real data volume.
scratch = "target/bench-results"

# Query files, one peptide per line. Relative paths resolve against index_dir.
#
#   mixed              the general-purpose file, used by ram / threads / detail
#   small/medium/large the length-bucketed files the `defaults` grid sweeps, so it can tell the
#                      retrieval-bound regime (short peptides) from the search-bound one (long).
#                      Produce them with bucket_peptides.sh.
#
# Each file needs at least `runs * amount` lines for the suite that reads it — the harness consumes
# them sequentially, so a short file shortens the later reps instead of failing. `run.sh` checks.
[peptides]
mixed = "../peptides/peptides_5_50.txt"
small = "../peptides/small.txt"
medium = "../peptides/medium.txt"
large = "../peptides/large.txt"

# Pre-built k-mer bound tables (sa-builder --output-kmer-table). Optional: a suite naming a table
# this profile does not have fails at startup with the list of what it does have.
#
# k6 is the production default (3.06 GB), chosen for the capped regime — see the `ram` suite's
# notes. k5 is 127 MB and is what a guaranteed-resident deployment would use; the `kmer` suite
# sweeps both against no table, so both have to be here for a full run.
[kmer_tables]
k5 = "kmer-tables/5mer_table.bin"
k6 = "kmer-tables/6mer_table.bin"
