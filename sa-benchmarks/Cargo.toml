[package]
name = "sa-benchmarks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sa-benchmarks"
path = "src/main.rs"

# fbc9328 has exactly one storage configuration — everything is read into owned memory at startup —
# so unlike the branch's harness this one has no arms to select. The empty feature set is kept so
# the driver's `--no-default-features` invocation still resolves.
[features]
default = []

[dependencies]
sa-index        = { path = "../sa-index" }
sa-mappings     = { path = "../sa-mappings" }
sa-compression  = { path = "../sa-compression" }
text-compression = { path = "../text-compression" }
clap       = { version = "4.5", features = ["derive"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand       = "0.8"
sysinfo    = "0.30"
rayon      = "1.8"
