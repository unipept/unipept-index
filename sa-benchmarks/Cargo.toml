[package]
name = "sa-benchmarks"
version = "0.1.0"
edition = "2021"
# Not `rust-version.workspace = true`: sa-benchmarks is a dev-only measurement harness, is not a
# default member, and ships to nobody, but its `sysinfo` 0.39.6 dependency requires rustc 1.95, well
# above the workspace's 1.88 floor. Declaring its own floor means `cargo -p sa-benchmarks` on an
# older toolchain says so plainly instead of failing deep inside a dependency.
rust-version = "1.95"

[[bin]]
name = "sa-benchmarks"
path = "src/main.rs"

[[bin]]
name = "generate-peptides"
path = "src/generate_peptides.rs"

[features]
default = []
# Storage selection lives entirely in sa-server; forwarding only there is what keeps this crate
# and the loaders it calls from ever resolving to different backends.
mmap = ["sa-server/mmap"]
preloaded-text = ["sa-server/preloaded-text"]
preloaded-proteins = ["sa-server/preloaded-proteins"]
preloaded-mapping = ["sa-server/preloaded-mapping"]

[dependencies]
sa-index            = { path = "../sa-index" }
sa-server           = { path = "../sa-server" }
protein-text    = { path = "../protein-text" }
protein-metadata = { path = "../protein-metadata" }
clap       = { version = "4.5", features = ["derive"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand       = "0.10"
sysinfo    = "0.39"
rayon      = "1.8"
