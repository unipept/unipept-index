[package]
name = "sa-benchmarks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sa-benchmarks"
path = "src/main.rs"

[[bin]]
name = "generate-peptides"
path = "src/generate_peptides.rs"

[features]
default = []
# Storage selection lives entirely in sa-server; forwarding only there is what keeps this crate
# and the loaders it calls from ever resolving to different backends.
mmap = ["sa-server/mmap"]
preloaded-text = ["sa-server/preloaded-text"]
preloaded-proteins = ["sa-server/preloaded-proteins"]
preloaded-mapping = ["sa-server/preloaded-mapping"]
# Pass-through for sa-index's hot-path instrumentation. Off by default so timing runs are
# uninstrumented; switch it on for diagnostic runs that want the phase breakdown and the
# tryptic candidate acceptance rate.
metrics = ["sa-index/metrics"]

[dependencies]
sa-index            = { path = "../sa-index" }
sa-server           = { path = "../sa-server" }
text-compression    = { path = "../text-compression" }
clap       = { version = "4.5", features = ["derive"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand       = "0.8"
sysinfo    = "0.30"
rayon      = "1.8"
