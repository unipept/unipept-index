[package]
name = "sa-benchmarks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sa-benchmarks"
path = "src/main.rs"

[dependencies]
sa-index   = { path = "../sa-index" }
sa-server  = { path = "../sa-server" }
clap       = { version = "4.5", features = ["derive"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand       = "0.8"
sysinfo    = "0.30"
rayon      = "1.8"
