[package]
name = "protein-metadata"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
# tempfile, not tempdir: tempdir is deprecated (RUSTSEC-2018-0017) and pulls remove_dir_all
# 0.5.3, which carries RUSTSEC-2023-0018. sa-builder's tests already use tempfile.
tempfile = "3"

[dependencies]
binary-traits = { path = "../binary-traits" }
fa-compression = { path = "../fa-compression" }
memory-hints = { path = "../memory-hints" }
bytelines = "2.5.0"
protein-text = { path = "../protein-text" }
memmap2 = "0.9"
