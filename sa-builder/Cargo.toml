[package]
name = "sa-builder"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
mmap = ["sa-index/mmap", "sa-mappings/mmap"]
preloaded-text = ["sa-index/preloaded-text", "sa-mappings/preloaded-text"]
preloaded-proteins = ["sa-index/preloaded-proteins", "sa-mappings/preloaded-proteins"]
preloaded-mapping = ["sa-index/preloaded-mapping"]

[dev-dependencies]
tempfile = "3"

[dependencies]
clap = { version = "4.4.8", features = ["derive"] }
libsais64-rs = { path = "../libsais64-rs" }
libdivsufsort-rs = "0.1.0"
sa-mappings = { path = "../sa-mappings" }
sa-index = { path = "../sa-index" }
text-compression = { path = "../text-compression" }
