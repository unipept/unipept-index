[package]
name = "fa-compression"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = "0.5.1"
rand = "0.8.5"

# NOTE: no `[profile.bench]` here, and no `opt-level` on the target below. Cargo only honours
# profiles in the *workspace root* manifest and warns about ones declared anywhere else, and
# `opt-level` is not a valid `[[bench]]` key either — both settings that used to live here were
# silently ignored for their whole life. The benches therefore run on Cargo's default `bench`
# profile (which inherits `release`: opt-level 3), which is what was wanted anyway.
[[bench]]
name = "bench_main"
harness = false
