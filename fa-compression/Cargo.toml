[package]
name = "fa-compression"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
criterion = "0.8.2"
rand = "0.8.5"

# Profile settings belong in the workspace root manifest; Cargo ignores them here. The benches run
# on the default `bench` profile, which inherits `release`.
[[bench]]
name = "bench_main"
harness = false
