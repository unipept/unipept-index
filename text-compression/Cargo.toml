[package]
name = "text-compression"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
mmap = ["dep:memmap2"]
# Keep the protein text in owned RAM even in an mmap build. No effect without `mmap`.
preloaded-text = []

[dependencies]
binary-traits = { path = "../binary-traits" }
bitarray = { path = "../bitarray" }
prefetch = { path = "../prefetch" }
memmap2 = { version = "0.9", optional = true }

[dev-dependencies]
tempfile = "3"
