[package]
name = "sa-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The only storage features in the workspace. They forward to nothing: all they do is pick which
# concrete type each `Active*` alias in `src/backends.rs` names.
[features]
mmap = []
# Per-structure overrides — keep this one structure in owned RAM while the rest stays mapped.
# All three are no-ops without `mmap`, where everything is owned already.
preloaded-text = []
preloaded-proteins = []
preloaded-mapping = []

[dependencies]
binary-traits = { path = "../binary-traits" }
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.197", features = ["derive"] }
tokio = { version = "1.36.0", features = ["rt", "rt-multi-thread", "macros"] }
sa-index = { path = "../sa-index" }
clap = { version = "4.5.1", features = ["derive"] }
protein-metadata = { path = "../protein-metadata" }
protein-text = { path = "../protein-text" }

# Building the reference response the parity test compares against. Already in the graph via axum.
[dev-dependencies]
serde_json = "1.0"
