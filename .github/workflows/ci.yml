# Everything that gates a change, in one workflow, so branch protection has a single coherent set
# of required checks to name.
#
# Every job runs on stable via `RUSTUP_TOOLCHAIN`, which takes precedence over rust-toolchain.toml.
# The exception is `fmt`, which needs the pinned nightly and gets it by *not* setting that variable.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

# A force-push replaces its predecessor rather than racing it. Not on develop or main: runs there
# are the record of what the branch did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    # One cell, because the libraries have no storage feature to vary. Both backends of every
    # structure are always compiled, and the searcher's fixtures load each combination by naming
    # its types, so a single `cargo test` exercises all of them — see
    # `sa-index/src/sa_searcher/test_utils.rs`. What the features still choose is which combination
    # the *binaries* are built for; that is covered by the `server-backends` job below.
    name: Check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # `--all-targets` is not redundant with the `cargo test` below: it is the only thing that
      # compiles `fa-compression`'s criterion bench, which `cargo test` does not build.
      - name: Run cargo check
        run: cargo check --all-targets --locked

      - name: Run cargo test
        run: cargo test --locked

  release-build:
    # `cargo check` proves the workspace typechecks; it does not prove it links, and it never
    # exercises the release profile.
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked

  server-backends:
    # `sa-server` is where the storage features now live, and all they do is pick which concrete
    # type each `Active*` alias names (see `sa-server/src/backends.rs`). Nine resolutions; every one
    # has to typecheck, and each has to report the backends it actually selected — which is what
    # `backends::tests` checks, per configuration, so it is run rather than only compiled.
    # Checking `sa-benchmarks` covers `sa-server` too, since its features forward there and nowhere
    # else.
    #
    # Sequential rather than a matrix on purpose: the nine combinations share one warm target
    # directory and finish in well under a minute, where nine runners would each pay checkout,
    # toolchain and cache restore first.
    name: sa-server backend aliases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check every backend combination
        shell: bash
        run: |
          set -euo pipefail
          for features in "" "mmap" "mmap,preloaded-text" "mmap,preloaded-proteins" \
                          "mmap,preloaded-mapping" "mmap,preloaded-text,preloaded-proteins" \
                          "mmap,preloaded-text,preloaded-mapping" \
                          "mmap,preloaded-proteins,preloaded-mapping" \
                          "mmap,preloaded-text,preloaded-proteins,preloaded-mapping"; do
            echo "== ${features:-(none)} =="
            if [ -z "$features" ]; then
              cargo check --all-targets -p sa-benchmarks
              cargo test -p sa-server
            else
              cargo check --all-targets -p sa-benchmarks --features "$features"
              cargo test -p sa-server --features "$features"
            fi
          done

  clippy:
    name: Run Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Clippy gates the workspace on the toolchain it ships from, and nightly's lint set is not
    # stable's.
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # No `--workspace` here on purpose: it overrides the root `default-members`, which
      # exists to keep `sa-benchmarks` out of the default build. That package is linted
      # explicitly in the next step instead, so it cannot rot.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Clippy (sa-benchmarks)
        run: cargo clippy -p sa-benchmarks --all-features -- -D warnings

  docs:
    # `-D warnings` turns a broken intra-doc link — which nothing else in CI notices — into a
    # failure. `--no-deps` keeps it to this workspace's own documentation.
    name: Check documentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --no-deps --all-features --document-private-items

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Deliberately does not set RUSTUP_TOOLCHAIN: .rustfmt.toml needs the nightly pinned in
    # rust-toolchain.toml, and rustup reads that pin only when the variable is unset. Bump the
    # nightly there, never here.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check formatting
        run: cargo fmt --all --check
