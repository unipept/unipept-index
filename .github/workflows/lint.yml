on: push

name: Lint

jobs:
  lint:
    name: Run Clippy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # No `--workspace` here on purpose: it overrides the root `default-members`, which
      # exists to keep `sa-benchmarks` out of the default build. That package is linted
      # explicitly in the next step instead, so it cannot rot.
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Clippy (sa-benchmarks)
        run: cargo clippy -p sa-benchmarks --all-features -- -D warnings

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest

    # Pinned, not floating. rustfmt's output changes between nightlies, so `@nightly` meant this
    # job could start failing on a commit that touched nothing — which is exactly what happened:
    # the tree was formatted with one nightly, a later one disagreed about seven files, and the
    # gate went red for everyone until someone reformatted.
    #
    # Bumping this is a deliberate two-step: change the date here, run `cargo +<date> fmt --all`,
    # and commit the reformat together with the bump so the gate never goes red in between. Add
    # the reformat's hash to .git-blame-ignore-revs while you are there.
    env:
      # nightly-2026-03-11 == rustc 1.96.0-nightly (0c68443b0 2026-03-10); the toolchain the tree
      # is currently formatted with.
      RUSTFMT_TOOLCHAIN: nightly-2026-03-11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Nightly is REQUIRED here: .rustfmt.toml sets `unstable_features = true` together with
      # `imports_granularity`, `group_imports`, `normalize_comments` and
      # `normalize_doc_attributes`. Stable rustfmt silently ignores those options and would
      # therefore accept (and produce) a different formatting than the one the repo targets.
      - name: Install pinned nightly Rust with rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo +${{ env.RUSTFMT_TOOLCHAIN }} fmt --all --check
