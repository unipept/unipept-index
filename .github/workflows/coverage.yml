on: workflow_dispatch

name: Coverage

jobs:
  coverage:
    name: Codecov
    runs-on: ubuntu-latest

    # Overrides rust-toolchain.toml, which pins a nightly for rustfmt's sake. Coverage measures
    # the toolchain the workspace ships from.
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # One instrumented run over the whole default workspace. No `--workspace`: that would
      # override the root `default-members` and pull in the `sa-benchmarks` harness.
      # `--all-features` makes this cover the mmap backend as well as the preloaded one.
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --no-fail-fast --lcov --output-path lcov.info

      # A single report, uploaded once. The per-package flags are declared in codecov.yml with
      # `paths:` filters, so Codecov slices this one report per package for the per-flag
      # project statuses.
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: binary-traits,bitarray,fa-compression,memory-hints,protein-metadata,protein-text,sa-builder,sa-index,sa-server
          verbose: true
          fail_ci_if_error: true
