on: push

name: Test

jobs:
  test:
    # One cell, because the libraries no longer have a storage feature to vary. Both backends of
    # every structure are always compiled, and the searcher's fixtures load each combination by
    # naming its types, so a single `cargo test` exercises all of them — see
    # `sa-index/src/sa_searcher/test_utils.rs`. What the features still choose is which combination
    # the *binaries* are built for; that is covered by the `server-backends` job below.
    name: Check + test
    runs-on: ubuntu-latest

    # Overrides rust-toolchain.toml, which pins a nightly for rustfmt's sake. The workspace ships
    # from stable, so that is what compiles and runs the tests here.
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      # Deliberately no `--workspace`: that would override the root `default-members`
      # and drag `sa-benchmarks` (a heavy, long-running bench harness) into every CI run.
      - name: Run cargo check
        run: cargo check --all-targets

      - name: Run cargo test
        run: cargo test

  server-backends:
    # `sa-server` is where the storage features now live, and all they do is pick which concrete
    # type each `Active*` alias names (see `sa-server/src/backends.rs`). Nine resolutions; every one
    # has to typecheck, and each has to report the backends it actually selected — which is what
    # `backends::tests` checks, per configuration, so it is run rather than only compiled.
    # Checking `sa-benchmarks` covers `sa-server` too, since its features forward there and nowhere
    # else.
    name: sa-server backend aliases
    runs-on: ubuntu-latest

    # Overrides rust-toolchain.toml, which pins a nightly for rustfmt's sake. The workspace ships
    # from stable, so that is what compiles and runs the tests here.
    env:
      RUSTUP_TOOLCHAIN: stable

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check every backend combination
        shell: bash
        run: |
          set -euo pipefail
          for features in "" "mmap" "mmap,preloaded-text" "mmap,preloaded-proteins" \
                          "mmap,preloaded-mapping" "mmap,preloaded-text,preloaded-proteins" \
                          "mmap,preloaded-text,preloaded-mapping" \
                          "mmap,preloaded-proteins,preloaded-mapping" \
                          "mmap,preloaded-text,preloaded-proteins,preloaded-mapping"; do
            echo "== ${features:-(none)} =="
            if [ -z "$features" ]; then
              cargo check --all-targets -p sa-benchmarks
              cargo test -p sa-server
            else
              cargo check --all-targets -p sa-benchmarks --features "$features"
              cargo test -p sa-server --features "$features"
            fi
          done
