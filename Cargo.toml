[workspace]
resolver = "2"

members = [ "binary-traits",
    "bitarray",
    "fa-compression",
    "libsais64-rs",
    "memory-hints",
    "protein-metadata",
    "protein-text",
    "sa-benchmarks",
    "sa-builder",
    "sa-index",
    "sa-server"
]

# `sa-benchmarks` is a dev-only measurement harness: it is a workspace member (so it resolves
# against the same lockfile and can be built explicitly) but deliberately NOT a default member,
# so a plain `cargo build` / `cargo test` / `cargo clippy` skips it and its extra dependencies
# (rand, sysinfo, rayon, serde_json, clap).
# Build or check it explicitly with `-p sa-benchmarks`.
# NOTE: `--workspace` (and `--all`) overrides this list and *does* include sa-benchmarks.
default-members = [ "binary-traits",
    "bitarray",
    "fa-compression",
    "libsais64-rs",
    "memory-hints",
    "protein-metadata",
    "protein-text",
    "sa-builder",
    "sa-index",
    "sa-server"
]

# Keys every member shares. Each one picks these up with `<key>.workspace = true` rather than
# repeating them, so the manifests cannot drift apart from each other.
[workspace.package]
# One edition for the whole workspace, stated once and inherited, so a member cannot be left
# behind on an older one — which would be a silent difference in how its source is parsed
# rather than a visible one.
#
# 2024 needs rustc 1.85; the let chains it enables need 1.88, which is the floor below. The
# migration cost three nested `if let`s collapsing into let chains and nothing else: this
# workspace has no `unsafe fn`, so edition 2024's `unsafe_op_in_unsafe_fn` has no surface
# here, and .rustfmt.toml was already on `style_edition = "2024"`.
#
# Note this does NOT set the resolver. That inference only happens for a package manifest;
# a virtual workspace root like this one falls back to `resolver = "1"` with a warning
# unless it says otherwise, which is why the key is spelled out above.
edition = "2024"

# 1.88 is the oldest compiler this workspace builds on, measured rather than assumed: 1.87 fails
# on `slice::as_chunks`, stabilised in 1.88.0 and used by `bitarray` and elsewhere. The highest
# floor any dependency declares is 1.86 (criterion), so it is this repository's own source that
# sets the number below.
#
# Declaring it here is not what enforces it. `cargo build`/`check` compare `rust-version` against
# a crate's *dependencies*, never against its own source, so on its own this key would only be
# documentation. The `msrv` job in ci.yml is what turns it into a gate: it builds the workspace on
# exactly this toolchain, so a source change that needs a newer compiler fails there.
#
# The floor moves only in a pull request whose purpose is moving it, naming the API or dependency
# that forced the raise, with the `msrv` job's pinned toolchain in ci.yml moving in the same
# commit. It never rides along in an unrelated change — a `cargo clippy --fix` autofix reaching
# for a newer std API is a reason to write it the old way, not a reason to bump. The repository
# maintainers decide, because the floor is a promise to consumers, not a local build detail.
#
# This is not rust-toolchain.toml. That file pins the nightly `cargo fmt` runs on; this says the
# oldest compiler a consumer can build the workspace with. #57 raised the floor to 1.88 through a
# clippy autofix that had nothing to object to, because nothing here declared a floor for it to
# violate — this closes that gap.
rust-version = "1.88"
