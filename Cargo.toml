[workspace]
# MSRV-aware: prefers dependency versions that each member's own `rust-version` can build.
# A preference, not a guarantee — it still resolves if nothing compatible satisfies a
# requirement. Must stay explicit: a virtual root infers no resolver from its members'
# editions and silently falls back to 1 without this key.
resolver = "3"

members = [ "binary-traits",
    "bitarray",
    "fa-compression",
    "libsais64-rs",
    "memory-hints",
    "protein-metadata",
    "protein-text",
    "sa-benchmarks",
    "sa-builder",
    "sa-index",
    "sa-server"
]

# `sa-benchmarks` is a dev-only measurement harness: it is a workspace member (so it resolves
# against the same lockfile and can be built explicitly) but deliberately NOT a default member,
# so a plain `cargo build` / `cargo test` / `cargo clippy` skips it and its extra dependencies
# (rand, sysinfo, rayon, serde_json, clap).
# Build or check it explicitly with `-p sa-benchmarks`.
# NOTE: `--workspace` (and `--all`) overrides this list and *does* include sa-benchmarks.
default-members = [ "binary-traits",
    "bitarray",
    "fa-compression",
    "libsais64-rs",
    "memory-hints",
    "protein-metadata",
    "protein-text",
    "sa-builder",
    "sa-index",
    "sa-server"
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
