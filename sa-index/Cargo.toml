[package]
name = "sa-index"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Hot-path instrumentation (phase timings + candidate acceptance counters on `Searcher`).
# Off by default: the clock reads and the atomic RMWs on searcher-wide cache lines perturb
# the very measurement they exist to produce (~2% at mlp_batch=1). With the feature off the
# counters are zero-sized and every write compiles away; `drain_timing_ns()` /
# `drain_candidate_counts()` stay callable and return zeros.
measure = []

[dev-dependencies]
tempfile = "3"

[dependencies]
binary-traits = { path = "../binary-traits" }
memmap2 = "0.9"
rayon = "1.8.1"
fa-compression = { path = "../fa-compression" }
serde = { version = "1.0.197", features = ["derive"] }
memory-hints = { path = "../memory-hints" }
protein-metadata = { path = "../protein-metadata" }
protein-text = { path = "../protein-text" }
bitarray = { path = "../bitarray" }
serde_json = "1.0.116"
