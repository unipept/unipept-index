[package]
name = "sa-index"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dev-dependencies]
tempfile = "3"

[dependencies]
binary-traits = { path = "../binary-traits" }
memmap2 = "0.9"
rayon = "1.8.1"
fa-compression = { path = "../fa-compression" }
serde = { version = "1.0.197", features = ["derive"] }
memory-hints = { path = "../memory-hints" }
protein-metadata = { path = "../protein-metadata" }
protein-text = { path = "../protein-text" }
bitarray = { path = "../bitarray" }
serde_json = "1.0.116"
